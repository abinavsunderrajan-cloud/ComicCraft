<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Export Successful - ComicCraft
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

<header class="main-header">

    <div class="container">

        <h1>🎨 ComicCraft</h1>

    </div>

</header>


<main class="container">

    <section class="success-card">

        <div class="success-icon">
            ✅
        </div>

        <h2>
            Comic Export Successful!
        </h2>

        <p>
            Your comic has been successfully
            converted into a PDF.
        </p>


        {% if pdf_url %}

        <a
            href="{{ pdf_url }}"
            class="primary-button"
            download
        >
            📥 Download Comic PDF
        </a>

        {% endif %}


        <a
            href="/"
            class="secondary-button"
        >
            Create Another Comic
        </a>

    </section>

</main>


<footer>

    <div class="container">

        <p>
            ComicCraft © 2026
        </p>

    </div>

</footer>


</body>

</html>
